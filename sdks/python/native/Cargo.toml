[package]
name = "parsequerade-python"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Python bindings for the shared Parsequerade execution core"
repository = "https://github.com/mainbrella/parsequerade"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
parsequerade = { path = "../../rust" }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
