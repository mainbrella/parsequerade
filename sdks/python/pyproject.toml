[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "parsequerade"
version = "0.1.0"
description = "A local App Store Connect facade with flat resources and scoped updates"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = ["cryptography>=41", "maturin>=1.9,<2"]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "parsequerade._native"
editable-profile = "dev"
locked = true
include = ["LICENSE", "src/parsequerade/py.typed"]
