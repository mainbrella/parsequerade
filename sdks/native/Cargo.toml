[package]
name = "parsequerade-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Shared host bridge to the Parsequerade execution core"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
parsequerade = { path = "../rust" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }

[dev-dependencies]
ring = "0.17"
